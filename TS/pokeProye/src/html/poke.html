<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon - Bulbasaur</title>
    <link rel="stylesheet" href="./../css/stylePoke.css" />
  </head>
  <body>
    <div class="container">
      <div class="pokemon-header">Pokémon: <span id="pokemon-name"></span></div>
      <div class="pokemon-id">#<span id="pokemon-id"></span></div>
      <img id="pokemon-image" class="pokemon-image" src="" />

      <div class="details">
        <div class="info-box" id="ability-box">
          <h3>Habilidades</h3>
        </div>
        <div class="info-box">
          <h3>Datos</h3>
          <p>Altura: <span id="height"></span> m</p>
          <p>Experiencia Base: <span id="base-exp"></span></p>
        </div>

        <div class="info-box" id="type-box">
          <h3>Tipos</h3>
          <p id="type-1" class="type"></p>
          <p id="type-2" class="type"></p>
        </div>
      </div>

      <div class="sprite">
        <h3>Sprite Shiny</h3>
        <img src="" alt="Shiny" class="pokemon-image" id="pokemon-image-shi" />
      </div>
    </div>

    <script type="module" src="../pokeDetalle.ts"></script>
  </body>
</html>
