<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main>
      <div class="box-1">
        <div class="lineaVida lideaTop">
          <div class="vida" id="vidaComida"></div>
          <p class="porcetajeVida"><span id="porcentajeComida">100</span> %</p>
        </div>

        <div
          id="botonesComida"
          class="box-botones box-botonesTop box-botonesLeft"
        >
          <div
            class="botonesAcciones botonesAccionesComida botonesComida-1"
          ></div>
          <div
            class="botonesAcciones botonesAccionesComida botonesComida-2"
          ></div>
          <div
            class="botonesAcciones botonesAccionesComida botonesComida-3"
          ></div>
        </div>
      </div>
      <div class="box-2">
        <div class="lineaVida lideaTop">
          <div class="vida" id="vidaDescanso"></div>
          <p class="porcetajeVida">
            <span id="porcentajeDesncanso">100</span> %
          </p>
        </div>

        <div
          id="botonesDescanso"
          class="box-botones box-botonesTop box-botonesRigth"
        >
          <div
            class="botonesAcciones botonesAccionesDescanso botonesDescanso-1"
          ></div>
          <div
            class="botonesAcciones botonesAccionesDescanso botonesDescanso-2"
          ></div>
          <div
            class="botonesAcciones botonesAccionesDescanso botonesDescanso-3"
          ></div>
        </div>
      </div>
      <div class="box-3">
        <div class="lineaVida lideaBott">
          <div class="vida" id="vidaAburrimiento"></div>
          <p class="porcetajeVida">
            <span id="porcentajeAburrimiento">100</span> %
          </p>
        </div>

        <div
          id="botonesAburrimiento"
          class="box-botones box-botonesBott box-botonesLeft"
        >
          <div
            class="botonesAcciones botonesAccionesAburrimiento botonesAburrimiento-1"
          ></div>
          <div
            class="botonesAcciones botonesAccionesAburrimiento botonesAburrimiento-2"
          ></div>
          <div
            class="botonesAcciones botonesAccionesAburrimiento botonesAburrimiento-3"
          ></div>
        </div>
      </div>
      <div class="box-4">
        <div class="lineaVida lideaBott">
          <div class="vida" id="vidaA"></div>
          <p class="porcetajeVida"><span id="porcentajeA">100</span> %</p>
        </div>

        <div id="botonesA" class="box-botones box-botonesBott box-botonesRigth">
          <div class="botonesAcciones botonesAccionesA botonesA-1"></div>
          <div class="botonesAcciones botonesAccionesA botonesA-2"></div>
          <div class="botonesAcciones botonesAccionesA botonesA-3"></div>
        </div>
      </div>
      <div class="box-5">
        <img
          src="./src/img/zorro.png"
          alt="tamagochiZorroPixelArt"
          id="zorro"
        />
        <div class="lideaTotal">
          <div class="vida" id="vidaTotal"></div>
          <p class="porcetajeVida"><span id="porcentajeTama">100</span> %</p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
